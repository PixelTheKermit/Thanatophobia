# The dummy should contain everything that's important to show on the Character Creation Menu.
- type: entity
  parent: BaseSpeciesDummy
  id: MobHumanDummy
  noSpawn: true

# The basemob itself should have everything that's related to actual gameplay.
# Anything human specific (e.g. UI, input) goes under MobHuman
- type: entity
  parent: [MobHumanDummy, BaseMobSpeciesOrganic]
  id: BaseMobHuman
  name: Urist McHands
  abstract: true
  components:
  - type: Hunger
    starvationDamage:
      types:
        Cold: 0.5
        Bloodloss: 0.5
  - type: Icon # It will not have an icon in the adminspawn menu without this. Body parts seem fine for whatever reason.
    sprite: Mobs/Species/Human/parts.rsi
    state: full
  - type: Thirst
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 5
