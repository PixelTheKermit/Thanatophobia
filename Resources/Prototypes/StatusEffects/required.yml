# Stores all the "required" effects. Most of these are hardcoded.
# TODO: Unhardcode it. Then organise these into seperate files.

- type: entity
  id: Stun
  name: stunned
  description: You are stunned! You are unable to move around or interact with anything.
  noSpawn: true
  components:
  - type: StatusEffect
    maxStrength: 1
  - type: PreventMovementEffect
  - type: PreventUseOfHandsEffect
  - type: ClearEffectOnCrit
  - type: ForceSayOnApplyEffect
  - type: AlertEffect
    alert: Stun
  - type: Tag
    tags:
    - Stunned

- type: entity
  id: KnockedDown
  name: knocked down
  description: You are knocked down! And the ground doesn't taste too good...
  noSpawn: true
  components:
  - type: StatusEffect
    maxStrength: 1
  - type: ReduceEffectTimeOnInteract
  - type: AdjustTileFrictionEffect
  - type: ForcedDownedEffect
  - type: ClearEffectOnCrit
  - type: AlertEffect
    alert: Stun
  - type: Tag
    tags:
    - KnockedDown

- type: entity
  id: Paralysis
  name: paralysis
  description: You are paralysed! Your body drops down to the floor as you are unable to do anything.
  noSpawn: true
  components:
  - type: StatusEffect
    maxStrength: 1
  - type: PreventMovementEffect
  - type: PreventUseOfHandsEffect
  - type: ClearEffectOnCrit
  - type: ForceSayOnApplyEffect
  - type: AdjustTileFrictionEffect
  - type: ForcedDownedEffect
  - type: AlertEffect
    alert: Stun
  - type: Tag
    tags:
    - KnockedDown
    - Stunned

- type: entity
  id: ForcedSleep
  name: forced sleep
  description: Due to one way or another, you have fallen asleep. You will be unable to wake up until this effect ends.
  noSpawn: true
  components:
  - type: StatusEffect
    maxStrength: 1
  - type: ForceSleepingEffect
  - type: Tag
    tags:
    - KnockedDown
    - Stunned
    - Sleep

- type: entity
  id: NarcolepsySleep
  parent: ForcedSleep
  name: narcoleptic sleep
  description: Due to your narcolepsy, you have fallen asleep. You will be unable to wake up until this effect ends.
  noSpawn: true

- type: entity
  id: TemporaryBlindness
  name: temporary blindness
  description: You're blind. Don't panic! It's only for a moment.
  noSpawn: true
  components:
  - type: StatusEffect
    maxStrength: 1
  - type: BlindnessEffect

- type: entity
  id: Slowdown
  name: slowdown
  description: You're slowed down.
  noSpawn: true
  components:
  - type: StatusEffect
    maxStrength: 5
  - type: AdjustSpeedEffect
    walkingSpeed: 0.7
    sprintingSpeed: 0.7

- type: entity
  id: StaminaSlowdown
  parent: Slowdown
  name: stamina slowdown
  description: Your lack in energy makes you very slow.
  noSpawn: true
  components:
  - type: StatusEffect
    maxStrength: 1
  - type: AdjustSpeedEffect
    walkingSpeed: 0.5
    sprintingSpeed: 0.5

- type: entity
  id: VomitSlowdown
  parent: Slowdown
  name: sick slowdown
  description: Bleh! You feel weakened after puking your guts out.
  noSpawn: true
  components:
  - type: StatusEffect
    maxStrength: 1
  - type: AdjustSpeedEffect
    walkingSpeed: 0.5
    sprintingSpeed: 0.5

- type: entity
  id: FlashSlowdown
  parent: Slowdown
  name: flash slowdown
  description: Your ears ring, your eyes hurt, and you're stumbling around.
  noSpawn: true
  components:
  - type: StatusEffect
    maxStrength: 1
  - type: AdjustSpeedEffect
    walkingSpeed: 0.5
    sprintingSpeed: 0.5

- type: entity
